spring:
  datasource:
    url: jdbc:h2:mem:landslidedb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;NON_KEYWORDS=KEY,VALUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration/h2
    baseline-on-migrate: true
  data:
    redis:
      enabled: false
  kafka:
    enabled: false
  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    root: INFO
    com.ner.landslide: DEBUG
