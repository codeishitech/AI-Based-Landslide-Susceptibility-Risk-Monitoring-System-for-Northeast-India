spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: ner-landslide-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/landslide_db}
    username: ${DB_USERNAME:landslide_user}
    password: ${DB_PASSWORD:landslide_pass}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

server:
  port: ${SERVER_PORT:9090}
  error:
    include-message: always

app:
  jwt:
    secret: ${JWT_SECRET:this-is-a-dev-only-secret-change-me-in-production-please-0123456789}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

  ml-service:
    url: ${ML_SERVICE_URL:http://localhost:8000}

  weather-service:
    url: ${WEATHER_API_URL:https://api.weather-provider.example.com/v1}
    api-key: ${WEATHER_API_KEY:}

  satellite-service:
    url: ${SATELLITE_API_URL:}
    mock-enabled: ${SATELLITE_MOCK_ENABLED:true}

  jobs:
    weather-ingestion-interval-ms: ${WEATHER_INGESTION_INTERVAL_MS:1800000}   # 30 min
    prediction-refresh-interval-ms: ${PREDICTION_REFRESH_INTERVAL_MS:3600000} # 1 hour
    alert-expiry-check-interval-ms: ${ALERT_EXPIRY_CHECK_INTERVAL_MS:600000}  # 10 min

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    com.ner.landslide: DEBUG
    org.hibernate.SQL: WARN
